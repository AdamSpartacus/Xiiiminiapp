let BME=bme();if(window.CLOK&&window.CLNAME)BME=window.CLNAME;addEventListener("clok",()=>{if(window.CLNAME)BME=window.CLNAME});
function bload(){if(!window.CLOK)return Promise.reject(new Error("members only"));if(window.supabase&&BT.cl)return Promise.resolve();return new Promise((ok,bad)=>{const go=()=>{try{BT.cl=BT.cl||supabase.createClient(SB.url,SB.key,{realtime:{params:{eventsPerSecond:8}}});ok()}catch(e){bad(e)}};if(window.supabase)return go();const e=document.createElement("script");e.src=SB.lib;e.onload=go;e.onerror=()=>bad(new Error("load"));document.head.appendChild(e)})}
function bsub(ch){return new Promise((ok,bad)=>{const t=setTimeout(()=>bad(new Error("timeout")),8000);ch.subscribe(st=>{if(st==="SUBSCRIBED"){clearTimeout(t);ok()}else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){clearTimeout(t);bad(new Error(st))}})})}
function bdirList(q){const st=BT.dir?BT.dir.presenceState():{},m={};Object.values(st).forEach(a=>a.forEach(x=>{if(x&&x.b&&(!m[x.b]||x.n>m[x.b].n))m[x.b]=x}));q=(q||"").toLowerCase();return Object.values(m).filter(x=>!q||x.b.toLowerCase().includes(q)).sort((a,b)=>b.n-a.n)}
async function bdir(){if(BT.dir)return;await bload();const ch=BT.cl.channel("conclave:dir",{config:{presence:{key:BME+"~"+BT.sid}}});ch.on("presence",{event:"sync"},()=>{if($("#bRes"))bRender();bAdvert()});await bsub(ch);BT.dir=ch}
function bAdvert(){if(!BT.dir)return;if(BT.ch&&BT.pub&&BT.host){BT.dir.track({b:BT.name,o:BME,n:BT.members.length})}else{try{BT.dir.untrack()}catch(e){}}}
function bShell(h){_rest="";G=null;$("main").innerHTML=h}
function batchUI(tab){BT.tab=tab||BT.tab||"S";
 bShell(`<button class="bk" onclick="batchLeave();menu()">‹ Back</button><p class="eb" style="text-align:left;margin:0">Batches</p><div class="wm" style="text-align:left;font-size:28px;margin:2px 0 6px;text-indent:0">CHOOSE A BATCH</div>
 <div class="card"><p class="eb" style="text-align:left;margin:0 0 6px">No friends here yet?</p><p style="margin:0 0 10px;color:var(--mut)">Get matched into a random batch with other members waiting to play.</p><button class="pri" id="bRnd" type="button" style="width:100%;min-height:46px">Join random batch</button><p class="note err" id="bRe"></p></div>
 <div class="tabs"><button id="bTS" type="button" aria-pressed="${BT.tab=="S"}">Search</button><button id="bTC" type="button" aria-pressed="${BT.tab=="C"}">Create</button><button id="bTJ" type="button" aria-pressed="${BT.tab=="J"}">Friends key</button></div>
 <div id="bPS" ${BT.tab=="S"?"":"hidden"}><input class="bin" id="bQ" type="search" placeholder="Search batches" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false"><div id="bRes"></div><p class="note" id="bRs"></p></div>
 <form id="bPC" ${BT.tab=="C"?"":"hidden"} autocomplete="off" novalidate><label class="eb" style="text-align:left;display:block;margin:0">Batch name</label><input class="bin" id="bCn" maxlength="24" autocomplete="off">
  <label class="chk"><input type="checkbox" id="bCf"> Friends only (hidden from search)</label><div id="bKw" hidden><label class="eb" style="text-align:left;display:block;margin:0">Friends key</label><input class="bin" id="bCk" maxlength="24" placeholder="Share this with friends" autocomplete="off"></div>
  <p class="note err" id="bCe"></p><button class="pri" type="submit" style="width:100%;min-height:46px">Create &amp; join</button></form>
 <form id="bPJ" ${BT.tab=="J"?"":"hidden"} autocomplete="off" novalidate><label class="eb" style="text-align:left;display:block;margin:0">Batch name</label><input class="bin" id="bJn" maxlength="24" autocomplete="off"><label class="eb" style="text-align:left;display:block;margin:0">Friends key</label><input class="bin" id="bJk" maxlength="24" autocomplete="off">
  <p class="note err" id="bJe"></p><button class="pri" type="submit" style="width:100%;min-height:46px">Join</button></form>`);
 const tabs={bTS:["S","bPS"],bTC:["C","bPC"],bTJ:["J","bPJ"]};
 Object.keys(tabs).forEach(k=>$("#"+k).onclick=()=>{BT.tab=tabs[k][0];Object.keys(tabs).forEach(j=>{$("#"+j).setAttribute("aria-pressed",String(j==k));$("#"+tabs[j][1]).hidden=j!=k})});
 $("#bCf").onchange=()=>{$("#bKw").hidden=!$("#bCf").checked};
 let qt;$("#bQ").oninput=()=>{clearTimeout(qt);qt=setTimeout(bRender,200)};
 $("#bRnd").onclick=bRandom;
 $("#bPC").addEventListener("submit",e=>{e.preventDefault();bCreate()});
 $("#bPJ").addEventListener("submit",e=>{e.preventDefault();const n=bclean($("#bJn").value),k=$("#bJk").value.trim(),er=$("#bJe");if(!n||!k){er.textContent="Enter the batch name and friends key.";return}er.textContent="";bJoin("f-"+n.toLowerCase()+"-"+bhash(n.toLowerCase()+"|"+k),n,false,er)});
 $("#bRs").textContent="Connecting…";
 bdir().then(()=>{bRender()}).catch(()=>{$("#bRs").textContent="Could not reach the batch server. Check your connection and try again."});
}
function bRender(){const box=$("#bRes");if(!box)return;const l=bdirList($("#bQ")?$("#bQ").value.trim():"");box.innerHTML="";
 l.forEach(x=>{const d=document.createElement("div");d.className="bli";d.innerHTML=`<div><b>${esc(x.b)}</b><small>by ${esc(x.o)} · ${x.n}/6 online</small></div>`;const b=document.createElement("button");b.type="button";b.textContent=x.n>=6?"Full":"Join";b.disabled=x.n>=6;b.onclick=()=>bJoin("p-"+x.b.toLowerCase(),x.b,true,$("#bRe"));d.appendChild(b);box.appendChild(d)});
 $("#bRs").textContent=l.length?"":(BT.dir?"No batches found. Create one.":"Connecting…")}
async function bRandom(){const b=$("#bRnd"),er=$("#bRe");er.textContent="";b.disabled=true;b.textContent="Finding members…";
 try{await bdir();const l=bdirList("").filter(x=>x.n<6);const pick=l.find(x=>/^Random-/.test(x.b))||l[0];
  if(pick)await bJoin("p-"+pick.b.toLowerCase(),pick.b,true,er);else{const nm="Random-"+Math.random().toString(36).slice(2,6).toUpperCase();await bJoin("p-"+nm.toLowerCase(),nm,true,er)}}
 catch(e){er.textContent="Could not find a batch. Try again."}
 if(b.isConnected){b.disabled=false;b.textContent="Join random batch"}}
async function bCreate(){const n=bclean($("#bCn").value),priv=$("#bCf").checked,k=$("#bCk").value.trim(),er=$("#bCe");
 if(n.length<3){er.textContent="Batch name needs 3+ characters.";return}
 if(priv&&k.length<4){er.textContent="Friends key needs 4+ characters.";return}er.textContent="";
 if(priv)return bJoin("f-"+n.toLowerCase()+"-"+bhash(n.toLowerCase()+"|"+k),n,false,er);
 try{await bdir();if(bdirList("").some(x=>x.b.toLowerCase()==n.toLowerCase())){er.textContent="That name is taken. Join it from Search.";return}}catch(e){er.textContent="Could not reach the batch server.";return}
 bJoin("p-"+n.toLowerCase(),n,true,er)}
async function bJoin(id,name,pub,er){
 if(BT.ch)await batchLeave(true);
 try{await bload();
  const ch=BT.cl.channel("conclave:b:"+bhash(id),{config:{presence:{key:BME+"~"+BT.sid},broadcast:{self:true}}});
  BT.id=id;BT.name=name;BT.pub=pub;BT.msgs=[];BT.members=[];BT.host=false;BT.ch=ch;
  ch.on("presence",{event:"sync"},bLobbyUpdate).on("broadcast",{event:"chat"},p=>{BT.msgs.push(p.payload);if(BT.msgs.length>40)BT.msgs.shift();bChat()}).on("broadcast",{event:"start"},p=>bOnStart(p.payload));
  await bsub(ch);await ch.track({n:BME,k:BME+"~"+BT.sid,t:Date.now()});
  bLobby()}
 catch(e){try{BT.ch&&BT.cl.removeChannel(BT.ch)}catch(_){}BT.ch=null;if(er)er.textContent="Could not join the batch. Try again."}}
function bLobbyUpdate(){if(!BT.ch)return;const st=BT.ch.presenceState(),m=[];Object.values(st).forEach(a=>a.forEach(x=>x&&x.n&&m.push(x)));m.sort((a,b)=>a.t-b.t||(a.k<b.k?-1:1));
 BT.members=m;BT.host=!!m.length&&m[0].k==BME+"~"+BT.sid;
 if(m.length>6&&m.findIndex(x=>x.k==BME+"~"+BT.sid)>=6){batchLeave();batchUI("S");const r=$("#bRe");if(r)r.textContent="That batch is full.";return}
 bAdvert();const mem=$("#bMem");if(!mem)return;
 mem.innerHTML=m.slice(0,6).map((x,i)=>`<span class="${i==0?"h":""}">${i==0?"◬ ":""}${esc(x.n)}</span>`).join("");
 $("#bCnt").textContent=Math.min(m.length,6)+"/6 online";
 const go=$("#bGo");go.hidden=!BT.host;$("#bWait").hidden=BT.host}
function bChat(){const c=$("#bMsgs");if(!c)return;c.innerHTML=BT.msgs.map(x=>`<p><b>${esc(x.n)}</b> ${esc(x.t)}</p>`).join("");c.scrollTop=c.scrollHeight}
function bLobby(){
 bShell(`<button class="bk" onclick="batchLeave();batchUI('S')">‹ Leave batch</button><p class="eb" style="text-align:left;margin:0">${BT.pub?"Open batch":"Friends batch"}</p><div class="wm" style="text-align:left;font-size:28px;margin:2px 0 6px;text-indent:0">${esc(BT.name.toUpperCase())}</div>
 <div class="card"><div class="eb" style="text-align:left;margin:0;display:flex;justify-content:space-between"><span>Members</span><span id="bCnt"></span></div><div class="mem" id="bMem"></div>
 <p class="note" style="margin:8px 0 12px">Empty seats are filled by the Order. The table starts with up to 6 seats.</p>
 <button class="pri" id="bGo" type="button" style="width:100%;min-height:48px" hidden>Start the Conclave</button><p class="note" id="bWait" style="text-align:center">Waiting for the host to start.</p></div>
 <div class="card"><div class="eb" style="text-align:left;margin:0 0 8px">Live chat</div><div class="chat" id="bMsgs"></div>
 <form class="crow" id="bCf2" autocomplete="off"><input class="bin" id="bCi" maxlength="140" placeholder="Message your batch"><button class="pri" type="submit">Send</button></form></div>`);
 $("#bCf2").addEventListener("submit",e=>{e.preventDefault();const t=$("#bCi").value.trim();if(!t||!BT.ch)return;$("#bCi").value="";BT.ch.send({type:"broadcast",event:"chat",payload:{n:BME,t}})});
 $("#bGo").onclick=()=>{if(!BT.ch||!BT.host)return;BT.ch.send({type:"broadcast",event:"start",payload:{m:BT.members.slice(0,6).map(x=>({n:x.n,k:x.k}))}})};
 bLobbyUpdate();bChat()}
function bOnStart(p){if(!BT.ch||!p||!Array.isArray(p.m))return;const me=BME+"~"+BT.sid,others=p.m.filter(x=>x.k!=me).map(x=>x.n),n=Math.min(6,Math.max(4,p.m.length)),nm=["You",...others];
 for(const d of NAMES.slice(1)){if(nm.length>=n)break;if(!nm.includes(d))nm.push(d)}
 batchLeave();start(n,nm)}
async function batchLeave(keepDir){const ch=BT.ch;BT.ch=null;BT.host=false;BT.members=[];if(ch){try{await ch.untrack()}catch(e){}try{BT.cl.removeChannel(ch)}catch(e){}}
 if(!keepDir&&BT.dir){const d=BT.dir;BT.dir=null;try{d.untrack()}catch(e){}try{BT.cl.removeChannel(d)}catch(e){}}}

/* ===== live chat: one room per 10-minute window; it clears itself when the window ends ===== */
var CHAT={ch:null,win:0,tick:0,last:0,alive:false};const CW=600000;
function chatSt(t){const e=$("#lcSt");if(e)e.textContent=t}
function chatAdd(n,t,me){const b=$("#lcMsgs");if(!b)return;const d=document.createElement("div");d.className="lcm"+(me?" me":"");const x=document.createElement("b");x.textContent=n;const s=document.createElement("span");s.textContent=t;d.append(x,s);b.appendChild(d);while(b.children.length>100)b.removeChild(b.firstChild);b.scrollTop=b.scrollHeight}
async function chatDrop(){const c=CHAT.ch;CHAT.ch=null;if(c&&BT.cl){try{await BT.cl.removeChannel(c)}catch(e){}}}
function chatLeave(){CHAT.alive=false;clearInterval(CHAT.tick);CHAT.tick=0;chatDrop()}
async function chatJoin(){const w=Math.floor(Date.now()/CW);CHAT.win=w;await chatDrop();const m=$("#lcMsgs");if(m)m.textContent="";chatSt("Connecting…");
 try{await bload()}catch(e){chatSt("Chat unavailable");return}
 if(!CHAT.alive||w!==CHAT.win)return;
 const c=BT.cl.channel("conclave:chat:"+w,{config:{broadcast:{self:true}}});CHAT.ch=c;
 c.on("broadcast",{event:"m"},p=>{const d=p&&p.payload;if(!d||typeof d.t!=="string")return;const n=String(d.n||"Member").slice(0,24);chatAdd(n,d.t.slice(0,280),n===BME)});
 c.subscribe(s=>{if(c!==CHAT.ch)return;chatSt(s==="SUBSCRIBED"?"Live":(s==="CHANNEL_ERROR"||s==="TIMED_OUT")?"Reconnecting…":"Connecting…")})}
function chatClock(){if(!CHAT.alive)return;const l=CW-(Date.now()%CW),e=$("#lcCt");if(e)e.textContent=Math.floor(l/60000)+":"+String(Math.floor(l%60000/1000)).padStart(2,"0");if(Math.floor(Date.now()/CW)!==CHAT.win)chatJoin()}
function chatSend(){const i=$("#lcI");if(!i||!CHAT.ch||!CHAT.alive)return;const t=i.value.trim();if(!t||Date.now()-CHAT.last<1500)return;CHAT.last=Date.now();i.value="";CHAT.ch.send({type:"broadcast",event:"m",payload:{n:BME,t:t.slice(0,280)}})}
function chatUI(){if(!window.CLOK)return;chatLeave();CHAT.alive=true;G=null;
 $("main").innerHTML=`<p class="eb">Illuminati Secret Society</p><div class="wm" style="font-size:30px">LIVE CHAT</div><div class="card"><div class="eb" style="text-align:left;margin:0;display:flex;justify-content:space-between"><span id="lcSt">Connecting…</span><span>clears in <span id="lcCt">10:00</span></span></div><div id="lcMsgs" aria-live="polite"></div><div style="display:flex;gap:8px"><input id="lcI" maxlength="280" placeholder="Message the members" aria-label="Message" autocomplete="off"><button class="pri" id="lcS" type="button" style="width:auto">Send</button></div></div><div class="dock"><button onclick="chatLeave();menu()">Back</button></div>`;
 $("#lcS").onclick=chatSend;$("#lcI").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();chatSend()}});
 chatJoin();chatClock();CHAT.tick=setInterval(chatClock,1000)}

/* ===== 3D intro ===== */
function intro(){const el=$("#intro");menu();if(!el||!window.INTRO3D){el&&el.remove();return}
 let done=0;const go=()=>{if(done)return;done=1;try{INTRO3D.stop()}catch(e){}el.classList.add("out");setTimeout(()=>el.remove(),520)};
 $("#enter").onclick=go;
 INTRO3D.start(()=>{$("#ildg").textContent="Drag to turn"},()=>{$("#ildg").textContent=""});}

intro();

/* ===== fullscreen + landscape ===== */
(function(){
 if(document.documentElement.hasAttribute("data-tg"))return;
 const de=document.documentElement;
 const isFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
 function lock(){}
 function goFull(){
  const f=de.requestFullscreen||de.webkitRequestFullscreen;
  if(f&&!isFS()){try{Promise.resolve(f.call(de,{navigationUI:"hide"})).then(lock).catch(()=>{})}catch(e){}}
  else lock();
 }
 function exitFull(){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)try{x.call(document)}catch(e){}}
 const b=document.createElement("button");b.id="fsb";b.type="button";b.title="Fullscreen";b.setAttribute("aria-label","Toggle fullscreen");b.textContent="⛶";
 b.onclick=e=>{e.stopPropagation();isFS()?exitFull():goFull()};
 document.body.appendChild(b);
  /* first tap enters fullscreen (browsers require a gesture) */
 addEventListener("pointerdown",function once(){goFull();removeEventListener("pointerdown",once,true)},true);
 document.addEventListener("fullscreenchange",()=>{if(isFS())lock()});
 document.addEventListener("webkitfullscreenchange",()=>{if(isFS())lock()});
 lock();
 /* installable as a fullscreen app */
 try{
  const m={name:"Conclave · Illuminati",short_name:"Conclave",start_url:location.href,display:"fullscreen",background_color:"#000000",theme_color:"#000000"};
  const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
 }catch(e){}
})();

/* ===== inactivity watchdog: 30s with no input while the game waits on you ===== */
(function(){
 let last=Date.now(),wkey="",wstart=Date.now(),busy=0;
 const pill=document.createElement("div");pill.id="afk";pill.style.cssText="position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;padding:8px 14px;border-radius:999px;background:#000;border:1px solid rgba(255,255,255,.3);color:#f0f1f4;font:500 12px var(--sans);letter-spacing:.08em;display:none;white-space:nowrap";document.body.appendChild(pill);
 const act=()=>{last=Date.now();if(typeof G!=="undefined"&&G&&G.away){G.away=0;say("You returned to the table.");render()}};
 ["pointerdown","keydown","touchstart"].forEach(e=>addEventListener(e,act,true));
 const waiting=()=>G&&!G.away&&G.P&&(G.ph=="roll"||G.ph=="buy"||G.ph=="vote"||G.ph=="pick"||(G.ph=="bid"&&G.auc&&G.auc.waiting));
 setInterval(()=>{
  if(!G||!G.P){pill.style.display="none";return}
  const h=$("#hdr");if(h&&G.ph!="over"){const t=hdrT();if(h.textContent!==t)h.textContent=t}
  if(!waiting()){pill.style.display="none";wkey="";return}
  const k=G.ph+"|"+G.cur+"|"+G.r+"|"+(G.auc?G.auc.bid:"");
  if(k!==wkey){wkey=k;wstart=Date.now()}
  const left=Math.ceil((AFK_MS-(Date.now()-Math.max(last,wstart)))/1000);
  if(left<=10&&left>0){pill.textContent="Your move · "+left+"s until your holdings go to bidding";pill.style.display="block"}else pill.style.display="none";
  if(left<=0&&!busy){busy=1;pill.style.display="none";afk().finally(()=>busy=0)}
 },1000);
 async function afk(){
  const p=G.P[0],ph=G.ph;G.away=1;say("You went inactive. The Order acts in your name.");
  if(ph=="roll"){awayTurn(p)}
  else if(ph=="buy"){G.ph="wait";render();await sellAll(p);if(G.away)buy(0);else{G.ph="buy";render()}}
  else if(ph=="vote"){G.ph="wait";render();await sellAll(p);if(G.away)cast(0);else{G.ph="vote";render()}}
  else if(ph=="pick"){const mine=G.own.map((x,k)=>x==0?k:-1).filter(k=>k>=0);pickProp(mine.length?mine[0]:-1)}
  else if(ph=="bid"){bidAns(0)}
  render();
 }
})();
</script></body></html>
